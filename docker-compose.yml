# Postgres 16 for teammates without a local server (this laptop uses its local Postgres 18 on :5432).
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: vs, POSTGRES_PASSWORD: vs, POSTGRES_DB: vyaparsaathi}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  n8n:
    image: n8nio/n8n
    profiles: [n8n]
    ports: ["5678:5678"]
volumes:
  pgdata:
